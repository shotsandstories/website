<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Films — Shots & Stories</title>
<link rel="icon" type="image/jpeg" href="assets/logo.jpg">
<link rel="apple-touch-icon" href="assets/logo.jpg">
<meta name="description" content="Wedding and story films from Shots & Stories.">
<link rel="canonical" href="https://shotsandstories.co.in/films">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Shots & Stories">
<meta property="og:title" content="Films — Shots & Stories">
<meta property="og:description" content="Wedding and story films from Shots & Stories.">
<meta property="og:url" content="https://shotsandstories.co.in/films">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Films — Shots & Stories">
<meta name="twitter:description" content="Wedding and story films from Shots & Stories.">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<button id="ham-btn" onclick="togglePanel()" aria-label="Toggle menu">
  <span class="bar"></span><span class="bar"></span><span class="bar"></span>
</button>

<!-- LEFT PANEL -->
<div id="left-panel">
  <div class="panel-logo">
    <img src="assets/logo.png" alt="Shots & Stories">
  </div>
  <nav>
    <ul>
      <li><a href="./" class="nav-link">Home</a></li>
      <li><a href="galleries" class="nav-link">Photos</a></li>
      <li><a href="films" class="nav-link active">Films</a></li>
      <li><a href="./#section-about" class="nav-link">About</a></li>
      <li><a href="./#section-contact" class="nav-link">Contact</a></li>
    </ul>
  </nav>
  <div class="panel-footer">
    &copy; 2025 Shots &amp; Stories<br>
    <a href="admin" target="_blank">Admin Panel</a>
  </div>
</div>

<!-- RIGHT PANEL -->
<div id="right-panel">
  <section id="section-films" class="section-wrap" style="padding-top:100px">
    <p class="section-label">Portfolio</p>
    <h2 class="section-heading">Films</h2>
    <div id="films-list"></div>
  </section>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button class="lb-close" onclick="lbClose()">&#x2715;</button>
  <button class="lb-arrow left" onclick="lbMove(-1)">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <video id="lb-video" controls playsinline></video>
  <div id="lb-youtube">
    <img id="lb-yt-poster" src="" alt="" onclick="lbPlayYoutube()">
    <button class="lb-yt-play" onclick="lbPlayYoutube()" aria-label="Play video">&#9658;</button>
    <div id="lb-yt-frame"></div>
  </div>
  <button class="lb-arrow right" onclick="lbMove(1)">&#8250;</button>
  <div class="lb-cap" id="lb-cap"></div>
</div>
<div class="toast-msg" id="toast"></div>

<script src="assets/site.js"></script>
<script>
/* FILMS — each entry is one video (YouTube or Cloudinary), rendered as a
   poster-image card with a play badge; clicking opens the shared lightbox
   via openFilmLightbox() (site.js), same facade/playback machinery the
   Photos lightbox and homepage hero already use. */
function renderFilms(){
  const data=getData(); const el=document.getElementById('films-list');
  if(!data.films.length){el.innerHTML=`<p style="color:#aaa">No films yet.</p>`;return;}
  el.innerHTML=`<div class="films-grid">${data.films.map(f=>{
    const cover=filmCover(f);
    return `<div class="film-card" onclick="openFilmLightbox('${f.id}')">
      <div class="film-card-cover">
        ${cover?`<img src="${cover}" loading="lazy" alt="">`:''}
        <span class="video-badge">&#9654;</span>
      </div>
      <div class="film-card-body">
        <div class="gshead-title">${f.title}</div>
        <div class="gshead-cats">${f.tags.map((t,i)=>i===0?t:`<span class="sep">/</span>${t}`).join('')}</div>
        ${f.description?`<div class="gshead-desc">${f.description}</div>`:''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

renderFilms();

/* Render immediately from cached data (localStorage/DEFAULT_DATA) for a
   fast first paint, then re-render once data.json (the actually-published
   content) has loaded — see initData() in assets/site.js. */
(async()=>{
  if(await initData()){
    applyTheme();
    renderFilms();
  }
})();
</script>
</body>
</html>
