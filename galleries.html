<body>

  <section id="section-galleries" class="section-wrap" style="padding-top:100px">

    <h2 class="section-heading">Photos</h2>

  </section>
</div>

<!-- MASONRY OVERLAY — all photos of one album; clicking a tile opens the lightbox on top -->
<div id="masonry">
  <div class="masonry-head">
    <div>
      <div class="masonry-title" id="masonry-title"></div>
      <div class="masonry-count" id="masonry-count"></div>
    </div>
    <button class="masonry-close" onclick="closeMasonry()" aria-label="Close">&#x2715;</button>
  </div>
  <div class="masonry-grid" id="masonry-grid"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button class="lb-close" onclick="lbClose()">&#x2715;</button>
  <button class="lb-arrow left" onclick="lbMove(-1)">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <video id="lb-video" controls playsinline></video>
  <div id="lb-youtube">
    <img id="lb-yt-poster" src="" alt="" onclick="lbPlayYoutube()">
    <button class="lb-yt-play" onclick="lbPlayYoutube()" aria-label="Play video">&#9658;</button>
    <div id="lb-yt-frame"></div>
  </div>
  <button class="lb-arrow right" onclick="lbMove(1)">&#8250;</button>
  <div class="lb-cap" id="lb-cap"></div>
</div>
<div class="toast-msg" id="toast"></div>

<script src="assets/site.js"></script>
<script>
/* MASONRY — title / See More open a full-screen overlay with every photo in
   the album (CSS multi-column layout, so tiles keep their natural aspect
   ratio). Clicking a tile calls openAlbumLightbox(id, idx) — the lightbox
   (z-index above the overlay) shows that photo full screen, and closing it
   drops you back on the masonry view. Tiles use Cloudinary-resized copies
   (thumbUrl) and lazy-load; the lightbox loads the full-size original. */
let masonryOpen=false;
function openMasonry(albumId){
  const a=getData().albums.find(x=>x.id===albumId); if(!a) return;
  const photos=albumPhotos(a); if(!photos.length) return;
  document.getElementById('masonry-title').textContent=a.title;
  document.getElementById('masonry-count').textContent=photos.length+' photo'+(photos.length!==1?'s':'');
  // Exactly N photos per row (3 on desktop, 2 on phones), in album order.
  // Each row is its own flex container, so a row's tiles share one height
  // (widths proportional to each photo's ratio — see .masonry-tile in
  // site.css). An incomplete last row is narrowed to n/N of the width so a
  // lone photo doesn't blow up to full width.
  const per=window.innerWidth<=800?2:3;
  let html='';
  for(let s=0;s<photos.length;s+=per){
    const row=photos.slice(s,s+per);
    const w=row.length<per?` style="width:calc(${row.length}/${per}*100%)"`:'';
    html+=`<div class="masonry-row"${w}>`+row.map((p,j)=>
      `<div class="masonry-tile" onclick="openAlbumLightbox('${a.id}',${s+j})"><img src="${thumbUrl(p.url,900)}" loading="lazy" alt="" onload="this.parentElement.style.setProperty('--r',this.naturalWidth/this.naturalHeight)"></div>`).join('')+`</div>`;
  }
  document.getElementById('masonry-grid').innerHTML=html;
  const m=document.getElementById('masonry');
  m.classList.add('open'); m.scrollTop=0;
  document.body.style.overflow='hidden';
  masonryOpen=true;
}
function closeMasonry(){
  document.getElementById('masonry').classList.remove('open');
  document.body.style.overflow='';
  masonryOpen=false;
}
document.addEventListener('keydown',e=>{
  // Escape closes the lightbox first (lbKey handles that); only close the
  // masonry once the lightbox is already gone.
  if(e.key==='Escape' && masonryOpen && !document.getElementById('lightbox').classList.contains('open')) closeMasonry();
});

/* PHOTOS — albumPhotos()/openAlbumLightbox() in site.js already filter out
   any video/YouTube item mixed into an album (Films is its own section
   now), so this page only ever needs the photo-only list for thumbs too. */
function renderGalleries(){
  const data=getData(); const el=document.getElementById('galleries-list');
  const albumsWithPhotos=data.albums.filter(a=>albumPhotos(a).length); // an album that's gone entirely to video (all items filtered) has nothing to show here
  if(!albumsWithPhotos.length){el.innerHTML=`<p style="color:#aaa">No albums yet.</p>`;return;}
  el.innerHTML=albumsWithPhotos.map(a=>{
    const photos=albumPhotos(a);
    const thumbs=[...photos.slice(0,3)]; while(thumbs.length<3)thumbs.push('');
    return `<div class="gallery-section">
      <div class="gallery-section-head">
        <div class="gshead-title" onclick="openMasonry('${a.id}')">${a.title}</div>
        <div class="gshead-cats">${a.tags.map((t,i)=>i===0?t:`<span class="sep">/</span>${t}`).join('')}</div>
        ${a.description?`<div class="gshead-desc">${a.description}</div>`:''}
      </div>
      <div class="gallery-thumbs">${thumbs.map((img,i)=>{
        if(!img) return `<div class="gallery-thumb" onclick="openMasonry('${a.id}')"></div>`;
        return `<div class="gallery-thumb" onclick="openAlbumLightbox('${a.id}',${i})"><img src="${thumbUrl(img.url,800)}" loading="lazy" alt="" onload="this.parentElement.style.flexGrow=this.naturalWidth/this.naturalHeight"></div>`;
      }).join('')}</div>
      <button class="see-more-btn" onclick="openMasonry('${a.id}')">See More</button>
    </div>`;
  }).join('');
}

renderGalleries();

/* Render immediately from cached data (localStorage/DEFAULT_DATA) for a
   fast first paint, then re-render once data.json (the actually-published
   content) has loaded — see initData() in assets/site.js. */
(async()=>{
  if(await initData()){
    applyTheme();
    renderGalleries();
  }
})();
</script>
</body>
</html>
