<body>

<button id="ham-btn" onclick="togglePanel()" aria-label="Toggle menu">
  <span class="bar"></span><span class="bar"></span><span class="bar"></span>
</button>

<!-- LEFT PANEL -->
<div id="left-panel">
  <div class="panel-logo">
    <img src="assets/logo.jpg" alt="Shots & Stories">
  </div>
  <nav>
    <ul>
      <li><a href="#" class="nav-link active" data-sec="home">Home</a></li>
      <li><a href="galleries" class="nav-link">Galleries</a></li>
      <li><a href="#" class="nav-link" data-sec="about">About</a></li>
      <li id="nav-instagram-li" style="display:none"><a href="#" class="nav-link" data-sec="instagram">Instagram</a></li>
      <li><a href="#" class="nav-link" data-sec="contact">Contact</a></li>
    </ul>
  </nav>
  <div class="panel-footer">
    &copy; 2025 Shots &amp; Stories<br>
    <a href="admin" target="_blank">Admin Panel</a>
  </div>
</div>

<!-- RIGHT PANEL -->
<div id="right-panel">
  <section id="section-home">
    <div id="hero-slides"></div>
    <div class="hero-counter" id="hero-dots"></div>
    <div class="hero-progress"><div class="hero-progress-bar" id="progress-bar"></div></div>
    <div class="hero-scroll-hint"><span>Scroll</span><div class="arrow-down"></div></div>
  </section>

  <section id="section-about" class="section-wrap alt">
    <p class="section-label">The Photographer</p>
    <h2 class="section-heading" id="about-heading">About Us</h2>
    <div class="about-grid">
      <div class="about-img-wrap"><img id="about-img" src="https://images.unsplash.com/photo-1452587925148-ce544e77e70d?w=800&q=80" alt="About" loading="lazy"></div>
      <div class="about-content" id="about-body-content"></div>
    </div>
  </section>

  <section id="section-instagram" class="section-wrap alt" style="display:none">
    <p class="section-label">Follow Along</p>
    <h2 class="section-heading">Instagram</h2>
    <div id="instagram-embed"></div>
  </section>

  <section id="section-contact" class="section-wrap">
    <p class="section-label">Say Hello</p>
    <h2 class="section-heading">Get In Touch</h2>
    <form class="contact-form" id="contact-form" action="https://formspree.io/f/mbgrkzov" method="POST">
      <input type="text" name="name" placeholder="Your Name *" required>
      <input type="email" name="email" placeholder="Your Email *" required>
      <input type="text" name="subject" class="full" placeholder="Subject">
      <textarea name="message" class="full" placeholder="Your Message *" required></textarea>
      <p class="cf-note">* Required Fields</p>
      <button type="submit" class="btn-send">Send Message</button>
    </form>
  </section>
</div>

<!-- ALBUM DRAWER -->
<div id="album-drawer">
  <div class="drawer-topbar">
    <button class="drawer-back" onclick="closeDrawer()">&#8592; Back</button>
    <button class="drawer-close-x" onclick="closeDrawer()">&#x2715;</button>
  </div>
  <h2 id="drawer-title"></h2>
  <div id="drawer-cats"></div>
  <p id="drawer-desc"></p>
  <div class="album-images" id="drawer-images"></div>
  <div class="drawer-nav">
    <button onclick="drawerNav(-1)">&#8592; Prev</button>
    <span class="sep">/</span>
    <button onclick="drawerNav(1)">Next &#8594;</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button class="lb-close" onclick="lbClose()">&#x2715;</button>
  <button class="lb-arrow left" onclick="lbMove(-1)">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <video id="lb-video" controls playsinline></video>
  <button class="lb-arrow right" onclick="lbMove(1)">&#8250;</button>
  <div class="lb-cap" id="lb-cap"></div>
</div>
<div class="toast-msg" id="toast"></div>

<script src="assets/site.js"></script>
<script>
/* HERO — slides come from data.hero (managed in admin.html's Hero tab),
   not hardcoded here. Each slide independently stores its own image/label/
   title and optionally links to an album by id. */
let currentSlide=0, slideTimer=null;
const SLIDE_DURATION=5000;

function buildHero(){
  currentSlide=0; // safe to call buildHero() again after a late data.json fetch resolves
  const data=getData();
  const slides=data.hero||[];
  const wrap=document.getElementById('hero-slides');
  if(!slides.length){
    wrap.innerHTML='';
    document.getElementById('hero-dots').innerHTML='';
    return;
  }
  wrap.innerHTML=slides.map((s,i)=>{
    const album=s.albumId?data.albums.find(a=>a.id===s.albumId):null;
    return `
    <div class="hero-slide${i===0?' active':''}" id="slide-${i}">
      <div class="slide-img" style="background-image:url('${s.url}')"></div>
      <div class="slide-gradient"></div>
      <div class="hero-text">
        <div class="hero-slide-label">${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}${s.label?` &nbsp;&mdash;&nbsp; ${s.label}`:''}</div>
        ${s.title?`<div class="hero-slide-title">${s.title}</div>`:''}
        ${album?`<div class="hero-slide-cats">${album.tags.map((c,j)=>j===0?c:`<span class="sep">/</span>${c}`).join('')}</div>`:''}
        ${album?`<button class="hero-view-btn" onclick="openDrawer('${album.id}')">View Album</button>`:`<a class="hero-view-btn" href="galleries">View Album</a>`}
      </div>
    </div>`;
  }).join('');
  document.getElementById('hero-dots').innerHTML=slides.map((_,i)=>`<div class="dot${i===0?' active':''}" onclick="heroGo(${i})"></div>`).join('');
  startSlideTimer();
}
function heroGo(n){
  const total=document.querySelectorAll('.hero-slide').length;
  n=((n%total)+total)%total;
  document.querySelectorAll('.hero-slide').forEach((s,i)=>s.classList.toggle('active',i===n));
  document.querySelectorAll('.hero-counter .dot').forEach((d,i)=>d.classList.toggle('active',i===n));
  currentSlide=n; resetProgress();
}
function startSlideTimer(){ clearInterval(slideTimer); slideTimer=setInterval(()=>heroGo(currentSlide+1),SLIDE_DURATION); resetProgress(); }
function resetProgress(){
  const bar=document.getElementById('progress-bar');
  bar.style.transition='none'; bar.style.width='0%'; bar.offsetWidth;
  bar.style.transition=`width ${SLIDE_DURATION}ms linear`; bar.style.width='100%';
}

/* ABOUT */
function renderAbout(){
  const data=getData(); const a=data.about||{};
  document.getElementById('about-heading').textContent=a.heading||'About Us';
  if(a.photo)document.getElementById('about-img').src=a.photo;
  document.getElementById('about-body-content').innerHTML=(a.body||'').split('\n\n').map(p=>p.trim()).filter(Boolean).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
}

/* INSTAGRAM — hidden entirely unless admin has pasted an embed snippet in
   the Theme tab (e.g. from snapwidget.com). Deliberately excluded from
   scroll-spy secIds below when hidden: a display:none section's offsetTop
   reads as 0, which would otherwise make the scroll-spy always think it's
   "already passed" and wrongly steal the active nav highlight. */
function renderInstagram(){
  const code=(getData().theme||{}).instagramEmbedCode;
  const section=document.getElementById('section-instagram');
  const navLi=document.getElementById('nav-instagram-li');
  if(!code){
    section.style.display='none';
    navLi.style.display='none';
    return false;
  }
  section.style.display='';
  navLi.style.display='';
  const container=document.getElementById('instagram-embed');
  // innerHTML doesn't execute <script> tags — pull them out and recreate as
  // real script elements so widget loaders (SnapWidget etc.) actually run
  const temp=document.createElement('div');
  temp.innerHTML=code;
  const scripts=[...temp.querySelectorAll('script')];
  scripts.forEach(s=>s.remove());
  container.innerHTML=temp.innerHTML;
  scripts.forEach(old=>{
    const s=document.createElement('script');
    [...old.attributes].forEach(a=>s.setAttribute(a.name,a.value));
    s.textContent=old.textContent;
    container.appendChild(s);
  });
  return true;
}

/* CONTACT FORM — submits via fetch to Formspree so we can stay on-page
   and show the existing toast instead of a full-page redirect. */
const contactForm = document.getElementById('contact-form');
contactForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = contactForm.querySelector('.btn-send');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await fetch(contactForm.action, {
      method: 'POST',
      body: new FormData(contactForm),
      headers: { 'Accept': 'application/json' }
    });
    if (res.ok) {
      showToast('Message sent!');
      contactForm.reset();
    } else {
      showToast('Could not send — try again', true);
    }
  } catch (err) {
    showToast('Network error — try again', true);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

/* SCROLL SPY — only Home/About/(optional Instagram)/Contact live on this
   page; Galleries is a separate page. secIds is `let`, not `const`, and
   rebuilt by updateSecIds() so it can change after data.json loads (e.g.
   Instagram wasn't configured in the cached copy but is in the published
   one) — the scroll listener below reads the outer variable fresh on every
   scroll event, so reassigning it later is safe. */
const rp=document.getElementById('right-panel');
let secIds=['home','about','contact'];
function updateSecIds(){
  const hasInstagram=renderInstagram();
  secIds=['home','about',...(hasInstagram?['instagram']:[]),'contact'];
}
updateSecIds();
rp.addEventListener('scroll',()=>{
  const sy=rp.scrollTop; let active='home';
  secIds.forEach(id=>{const el=document.getElementById('section-'+id);if(el&&el.offsetTop-100<=sy)active=id;});
  document.querySelectorAll('.nav-link[data-sec]').forEach(a=>a.classList.toggle('active',a.dataset.sec===active));
});
document.querySelectorAll('.nav-link[data-sec]').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    const el=document.getElementById('section-'+a.dataset.sec);
    if(el)rp.scrollTo({top:el.offsetTop,behavior:'smooth'});
    if(window.innerWidth<=900){panelOpen=false;document.getElementById('left-panel').classList.remove('visible');document.getElementById('ham-btn').classList.remove('open');}
  });
});

/* INIT — render immediately from cached data (localStorage/DEFAULT_DATA)
   for a fast first paint, then re-render once data.json (the actually-
   published content) has loaded, so first-time visitors aren't stuck
   seeing the bundled sample content. initData()/applyTheme() live in
   assets/site.js. */
buildHero();
renderAbout();

(async()=>{
  if(await initData()){
    applyTheme();
    buildHero();
    renderAbout();
    updateSecIds();
  }
})();

/* deep-link support: e.g. arriving from galleries page's ./#section-about link */
if (location.hash) {
  const target = document.querySelector(location.hash);
  if (target) requestAnimationFrame(() => rp.scrollTo({ top: target.offsetTop, behavior: 'auto' }));
}
</script>
</body>
</html>
